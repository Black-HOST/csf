name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scan.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: echo "tests=$(find .github/tests -name '*.t' -type f | sort | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  tests:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.unit.outputs.tests) }}
    name: "${{ matrix.test }}"
    steps:
      - uses: actions/checkout@v4
      - run: prove -v "$(find .github/tests -name '${{ matrix.test }}' -type f)"

  install:
    name: "Install"
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Setup CSF
        uses: ./.github/actions/setup-csf

  smoke:
    name: "Smoke"
    needs: install
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Setup CSF
        uses: ./.github/actions/setup-csf

      - name: Smoke CSF
        uses: ./.github/actions/smoke-csf

  upgrade:
    name: "Upgrade"
    needs: install
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install OS dependencies
        shell: bash
        run: apt-get update && apt-get install -y curl perl

      - name: Install latest release
        shell: bash
        run: bash <(curl -sL https://csf.black.host)

      - name: Pre-upgrade version
        shell: bash
        run: csf -v || true

      - name: Upgrade from source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sh install.sh

      - name: Post-upgrade version
        shell: bash
        run: csf -v || true

  uninstall:
    name: "Uninstall"
    needs: install
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Setup CSF
        uses: ./.github/actions/setup-csf

      - name: Run uninstaller
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          bash uninstall.sh

  security:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        shell: bash
        run: |
          matrix=$(find .github/tests/security -mindepth 2 -maxdepth 2 -type f -name Dockerfile | sort | jq -R -s -c 'split("\n") | map(select(length > 0) | split("/")[-2])')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  security-tests:
    needs: security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.security.outputs.matrix) }}
    name: "${{ matrix.suite }}"
    env:
      TEST_SUITE_DIR: .github/tests/security/${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable security test environment
        run: docker build -f "$TEST_SUITE_DIR/Dockerfile" -t csf-security-test .
      - name: Run security regression test
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" csf-security-test bash "/repo/$TEST_SUITE_DIR/run.sh"

  compatibility:
    uses: ./.github/workflows/compatibility.yml
